<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#07110b">
<title>Trilheiros de Rondonópolis — Expedição Mato Grosso</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07110b;font-family:system-ui,-apple-system,Segoe UI,sans-serif}.shell{position:fixed;inset:0;background:#07110b}.game{position:absolute;inset:0;width:100%;height:100%;border:0;background:#07110b}.logo-badge{position:fixed;z-index:9999;left:max(10px,env(safe-area-inset-left));top:max(10px,env(safe-area-inset-top));width:92px;height:92px;display:flex;align-items:center;justify-content:center;border-radius:24px;background:rgba(5,18,11,.62);border:1px solid rgba(255,255,255,.16);backdrop-filter:blur(8px);box-shadow:0 10px 28px rgba(0,0,0,.36);pointer-events:none}.logo-badge img{max-width:82px;max-height:82px;object-fit:contain;filter:drop-shadow(0 4px 8px rgba(0,0,0,.35))}.brand-strip{position:fixed;z-index:9998;left:111px;top:max(13px,env(safe-area-inset-top));padding:8px 12px;border-radius:999px;background:rgba(5,18,11,.58);border:1px solid rgba(255,255,255,.12);backdrop-filter:blur(7px);color:#fff;font-size:11px;font-weight:900;letter-spacing:.05em;pointer-events:none;text-shadow:0 2px 5px #000}.brand-strip span{color:#daf576}.loading{position:absolute;inset:0;display:grid;place-items:center;color:#d9e6dc;font-weight:800;text-align:center;padding:30px}.loading small{display:block;color:#8fa596;margin-top:8px;font-weight:600}
@media(max-width:700px){.logo-badge{width:70px;height:70px;border-radius:18px}.logo-badge img{max-width:62px;max-height:62px}.brand-strip{left:88px;top:13px;font-size:9px;padding:7px 9px}}
@media(max-width:480px){.brand-strip{display:none}.logo-badge{width:62px;height:62px}.logo-badge img{max-width:55px;max-height:55px}}
</style>
</head>
<body>
<div class="shell">
  <div class="loading">Carregando a aventura dos Trilheiros de Rondonópolis…<small>Expedição Mato Grosso</small></div>
  <iframe class="game" src="https://trilheiros-expedicao-mt.vercel.app/" title="Trilheiros de Rondonópolis — Expedição Mato Grosso" allow="fullscreen; autoplay" allowfullscreen></iframe>
</div>
<div class="logo-badge"><img src="https://i.postimg.cc/09t8GNX6/LOGO-TRILHEIROS-Photoroom.png" alt="Logo Trilheiros de Rondonópolis"></div>
<div class="brand-strip"><span>TRILHEIROS DE RONDONÓPOLIS</span> • EXPEDIÇÃO MATO GROSSO</div>
</body>
</html>
